<section class="panel panel-primary"><div class="section-heading"><div><span class="section-index">01</span><div><h2>上游密钥</h2><p>按上游保存密钥，实例只引用密钥记录，不重复录入。</p></div></div><button id="newProviderKey" class="button button-primary" type="button">添加密钥</button></div><div id="providerKeyGroups" class="provider-groups"></div></section>
<dialog id="providerKeyDialog"><form method="dialog" id="providerKeyForm"><div class="dialog-heading"><div><span class="section-index">NEW</span><div><h2>添加上游密钥</h2><p>OpenCode 使用公共访问，不需要保存密钥。</p></div></div><button class="icon-button" value="cancel" formnovalidate title="关闭">×</button></div><label>上游<select name="provider" required><option value="tokenrouter">TokenRouter</option><option value="cline">Cline</option><option value="freebuff">FreeBuff</option></select></label><label>名称<input name="label" maxlength="80" placeholder="例如 主账号" required></label><label>API Key<input name="secret" type="password" maxlength="512" autocomplete="new-password" required></label><div class="dialog-actions"><button value="cancel" formnovalidate class="button button-quiet">取消</button><button value="default" class="button button-primary">保存</button></div></form></dialog>
